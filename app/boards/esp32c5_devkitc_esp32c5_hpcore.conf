# ESP32-C5-WROOM-1-specific Kconfig, auto-merged by Zephyr's build system for
# board target esp32c5_devkitc/esp32c5/hpcore (filename matches the full
# target with slashes replaced by underscores, same convention as
# nrf54l15dk_nrf54l15_cpuapp.conf).
#
# embarch-dev-bench/design.md §3 decision [interim ESP32-C5]: temporary
# substitute dev-bench board while the real nRF54L15DK replacement is in
# transit (broken unit RMA'd, ETA ~1 week from 2026-08-19). Values below were
# *not* blindly copied from the Nordic file -- each was checked empirically
# against a real `west build` for this board; see that decision's own text
# for what differed and why.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="embarch-dev-bench"

# BT_ESP32 (drivers/bluetooth/hci/Kconfig.esp32) is the HCI driver for
# Espressif's own BLE controller blob (libble_app.a etc., fetched via
# `west blobs fetch hal_espressif`) -- it is *not* directly settable here
# (empirically: "is assigned in a configuration file, but is not directly
# user-configurable (has no prompt)" -- it has no `prompt` in its Kconfig
# entry). It gets selected automatically once CONFIG_BT is on for a board
# whose SoC provides it, so no line for it belongs in this file at all.

# Unlike the nRF54L15DK (SoftDevice Controller, BT_MAX_CONN=2 needed because
# central/peripheral slots are carved out of one pool), Espressif's ESP32
# controller budgets central and peripheral connections independently
# (ESP32_BT_CTLR_LE_MAX_CONN, default 3) -- BT_MAX_CONN=2 here is just "one
# central + one peripheral link," not a controller-slot workaround.
CONFIG_BT_MAX_CONN=2

CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# Same reasoning as the nRF54L15DK conf: every BLE action runs synchronously
# on the main thread, blocking on semaphores across discovery/read/write and
# building advertising data on its stack.
#
# Real bug found and fixed, Milestone 3 (Study Designer: Feature-Branch
# Iteration): this line used to read 2048, silently overriding the shared
# app/prj.conf's own CONFIG_MAIN_STACK_SIZE=8192 -- Zephyr's board-conf
# fragment is merged *after* prj.conf, so the later value wins with no
# warning either build ever surfaced. Confirmed empirically against a real
# build's resolved build/zephyr/.config (2048, not 8192) before this fix.
# Harmless while dispatch_study only ever ran Action::BleAdvertise (a
# shallow call chain), but real Action::GattDiscover/GattMonitorAll dispatch
# (embarch-study-designer/design.md §3 decisions 31/32) is the first time
# this main thread's call depth actually reaches into BLE central-role GATT
# discovery/subscribe code -- restoring prj.conf's already-vetted margin here
# rather than leaving a real hardware build silently running a quarter of it.
CONFIG_MAIN_STACK_SIZE=8192

# Deliberately not setting CONFIG_BT_SETTINGS -- same RAM-only bonding-table
# posture as the nRF54L15DK conf (decision 11), unaffected by which board is
# running the firmware.

# --- GATT transcript (embarch-dev-bench/design.md §3 decision 36) ---
#
# ble_bridge_real.c's transcript_emit() builds one `struct
# ble_transcript_entry` (~290 bytes) as a stack local, deliberately rather
# than in a shared static: it is called from both the BT RX thread (anything
# inbound) and whichever thread called ble_bridge_execute, and a shared
# staging buffer would tear under a notification arriving mid-emit. Zephyr's
# default BT RX stack has no room for that frame on top of the GATT
# discovery/subscribe call depth already running there, so it is raised here
# rather than left to fail as an intermittent stack overflow under exactly
# the notification bursts this feature exists to capture.
CONFIG_BT_RX_STACK_SIZE=3072

# One ATT MTU's worth of notification is what DBM_MAX_TRANSCRIPT_PAYLOAD_LEN
# (serial_protocol.h) is sized for. Zephyr's defaults (L2CAP TX MTU 65) would
# cap a single notification at 62 bytes, silently fragmenting anything longer
# -- a shell/NUS response most of all -- into rows that each look like a
# separate event. 247 is the usual practical ceiling for one LL PDU with data
# length extension, and 244 = 247 - 3 bytes of ATT header.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
