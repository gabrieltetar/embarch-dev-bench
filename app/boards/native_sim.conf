# native_sim-specific Kconfig (embarch-dev-bench/design.md §3 decision 16).
# ble_bridge_stub.c pulls in no Zephyr BT Kconfig at all.
#
# native_sim's `zephyr,console` chosen node (uart0, "zephyr,native-pty-uart")
# only gets a real uart_poll_in/uart_poll_out-capable driver instance when
# CONFIG_SERIAL is on -- without it, the board falls back to a raw POSIX
# console with no standard UART device at all, which main.c's DEVICE_DT_GET
# needs. This is Zephyr's own native UART peripheral emulation (backed by a
# host PTY under the hood), not a bespoke test transport of our own --
# decision 16's "no virtual-PTY serial transport" is about not building extra
# test-only plumbing on top of this, not about avoiding native_sim's normal
# UART support.
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_PTY=y

# --- logging (embarch-dev-bench/design.md §3 decision 38) ----------------
#
# Deliberately NOT turning off CONFIG_LOG_BACKEND_NATIVE_POSIX, unlike the
# UART and RTT backends the shared prj.conf disables. That backend writes to
# the host process's *stdout*, and this board's link is a separate PTY
# (CONFIG_UART_NATIVE_PTY above), so it cannot corrupt COBS framing the way
# LOG_BACKEND_UART would on a real board -- and having log records visible in
# the terminal that launched zephyr.exe is exactly what a host-side sanity
# board is for. Confirmed by reading the resolved build/zephyr/.config, not
# assumed: NATIVE_POSIX is the only other backend this board enables.
