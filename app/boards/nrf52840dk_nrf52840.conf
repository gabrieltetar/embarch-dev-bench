# nRF52840DK-specific Kconfig, auto-merged by Zephyr for board target
# nrf52840dk/nrf52840 (same filename convention as the nRF54L15DK fragment).
#
# Same feature set as the nRF54L15DK image: the BLE central/peripheral bridge
# on the SoftDevice Controller, with the comments on each symbol kept in
# nrf54l15dk_nrf54l15_cpuapp.conf rather than copied here.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="embarch-dev-bench"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# REGOUT0 = 3.3 V at boot when the DK runs from its native USB (src/board_regout0.c).
CONFIG_EMBARCH_DEV_BENCH_REGOUT0_3V3=y
