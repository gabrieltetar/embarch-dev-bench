# nRF52840DK-specific Kconfig, auto-merged by Zephyr for board target
# nrf52840dk/nrf52840 (same filename convention as the nRF54L15DK fragment).
#
# Same feature set as the nRF54L15DK image: the BLE central/peripheral bridge
# on the SoftDevice Controller, with the comments on each symbol kept in
# nrf54l15dk_nrf54l15_cpuapp.conf rather than copied here.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="embarch-dev-bench"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# REGOUT0 = 3.3 V at boot when the DK runs from its native USB (src/board_regout0.c).
CONFIG_EMBARCH_DEV_BENCH_REGOUT0_3V3=y

# --- native USB: composite device, three CDC ACM ports (src/usb_device.c) ---
# The "next" USB device stack of the pinned NCS (v3.4.0, Zephyr 4.4 base).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# The nRF52840's unique ID is 8 bytes; the serial string is that ID in hex.
CONFIG_USBD_HWINFO_DEVID_LENGTH=8

# --- SMP on the third port: image updates through MCUboot ---
# Serial (console-framed) transport, the framing embarch-smp speaks.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_BASE64=y
CONFIG_UART_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

# --- analog capture (src/analog_source_nrf52.c) ---
# The SAADC through nrfx directly; the overlay disables &adc, so Zephyr's ADC
# driver does not also claim it. Pins come from the overlay's chosen nodes.
CONFIG_NRFX_SAADC=y
CONFIG_GPIO=y
