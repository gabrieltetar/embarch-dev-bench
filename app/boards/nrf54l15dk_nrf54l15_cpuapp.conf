# nRF54L15DK-specific Kconfig, auto-merged by Zephyr's build system for board
# target nrf54l15dk/nrf54l15/cpuapp (filename matches the full target with
# slashes replaced by underscores -- Zephyr's standard board-conf-fragment
# convention, no extra CMake wiring needed).
#
# embarch-dev-bench/design.md §3 decisions 3/5/11: SoftDevice Controller,
# Just Works pairing, bonds RAM-only (achieved simply by never enabling
# CONFIG_BT_SETTINGS below -- Zephyr's default without it is RAM-only).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="embarch-dev-bench"

# Two link slots, not one -- and NOT a relaxation of design decision 15's
# one-DUT-at-a-time rule. With the SoftDevice Controller, the central role gets
# `BT_MAX_CONN - BT_CTLR_SDC_PERIPHERAL_COUNT` slots (nrf/subsys/bluetooth/
# controller/Kconfig), and PERIPHERAL_COUNT defaults to 1 whenever
# BT_PERIPHERAL is on -- so BT_MAX_CONN=1 would leave the central role zero
# slots and break every central-role BleConnect, while still building cleanly.
# Two is also NCS's own default for this exact combination. The
# one-connection-at-a-time invariant is enforced in ble_bridge_real.c's
# execute_connect (it refuses to open a second link), not by this budget.
CONFIG_BT_MAX_CONN=2

# ble_bridge_real.c's DataExchange path acts as a GATT *client* against the DUT:
# service/characteristic discovery, read, write-with-response, and
# notify/indicate subscriptions. BT_CENTRAL alone doesn't bring the client role
# in.
CONFIG_BT_GATT_CLIENT=y
# Lets bt_gatt_subscribe() find a characteristic's CCC descriptor itself
# (subscribe_params.ccc_handle = BT_GATT_AUTO_DISCOVER_CCC_HANDLE), so
# ble_bridge_real.c doesn't need a third hand-rolled discovery pass. The
# subscribe_params fields it uses for that (end_handle/disc_params) only exist
# when this is enabled -- turning it off is a compile error there, not a
# silent behavior change.
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# Every BLE action runs synchronously on the main thread, which now waits on
# semaphores across discovery/read/write instead of returning immediately, and
# builds advertising data on its stack. 2 KiB leaves headroom over the nRF
# default (1 KiB) for that.
#
# Real bug found and fixed, Milestone 3 (Study Designer: Feature-Branch
# Iteration): this line used to silently override the shared app/prj.conf's
# own CONFIG_MAIN_STACK_SIZE=8192, since Zephyr merges a board-conf fragment
# *after* prj.conf and the later value wins with no warning -- confirmed
# empirically via the espressif board's own resolved .config before this fix
# (the identical bug, same root cause, present in this file too). Restoring
# prj.conf's already-vetted margin here now that real GATT-discovery dispatch
# (embarch-study-designer/design.md §3 decisions 31/32) is the first thing to
# actually exercise this main thread's deeper BLE-central call chains.
CONFIG_MAIN_STACK_SIZE=8192

# NOT setting CONFIG_BT_SETTINGS (and therefore not CONFIG_SETTINGS/CONFIG_FLASH
# either) is what keeps the BT bonding table RAM-only, per decision 11 --
# there is deliberately no flash-backed persistence to opt into here.

# --- GATT transcript (embarch-dev-bench/design.md §3 decision 36) ---
#
# ble_bridge_real.c's transcript_emit() builds one `struct
# ble_transcript_entry` (~290 bytes) as a stack local, deliberately rather
# than in a shared static: it is called from both the BT RX thread (anything
# inbound) and whichever thread called ble_bridge_execute, and a shared
# staging buffer would tear under a notification arriving mid-emit. Zephyr's
# default BT RX stack has no room for that frame on top of the GATT
# discovery/subscribe call depth already running there, so it is raised here
# rather than left to fail as an intermittent stack overflow under exactly
# the notification bursts this feature exists to capture.
CONFIG_BT_RX_STACK_SIZE=3072

# One ATT MTU's worth of notification is what DBM_MAX_TRANSCRIPT_PAYLOAD_LEN
# (serial_protocol.h) is sized for. Zephyr's defaults (L2CAP TX MTU 65) would
# cap a single notification at 62 bytes, silently fragmenting anything longer
# -- a shell/NUS response most of all -- into rows that each look like a
# separate event. 247 is the usual practical ceiling for one LL PDU with data
# length extension, and 244 = 247 - 3 bytes of ATT header.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
