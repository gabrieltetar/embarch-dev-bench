# Shared baseline Kconfig, both workspaces (embarch-dev-bench/design.md §2).

# embarch-dev-bench/design.md §3 decision 7: dev-bench's own log output
# travels as a `LogLine` DevBenchMessage, not raw text -- so nothing else
# (the boot banner, the logging subsystem, the shell) may also write to the
# link UART (the board's `zephyr,console` chosen device, see main.c), or it
# would corrupt COBS framing on the shared wire. No on-board status
# indication for v1 either way (§1) -- this firmware's state is observable
# only through embarch-core/study_status, not local console output.
#
# CONFIG_CONSOLE itself is left alone (native_sim's board Kconfig
# unconditionally force-selects console support and errors out if this tries
# to turn it off) -- disabling the two things that actually call printk/log
# on it is enough, since nothing else writes to this UART unprompted.
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n

# embarch-dev-bench/design.md §3 decision 21: `struct dev_bench_message`'s
# union now includes `struct dbm_study_start`, which embeds a full
# DBM_MAX_STEPS_PER_STUDY-sized `struct dbm_step` array (StudyStart's own
# wire worst case, see serial_protocol.h) -- several KB per message value.
# main.c keeps its own message buffers `static` rather than stack locals for
# exactly this reason, but Zephyr's small default main-thread stack (1024
# bytes) isn't enough headroom for the rest of main()'s own call depth
# (ble_bridge_execute, uart_poll_*, etc.) alongside that; bumped well past
# what's actually needed as margin, since both boards have ample RAM for one
# always-alive thread stack.
CONFIG_MAIN_STACK_SIZE=8192
