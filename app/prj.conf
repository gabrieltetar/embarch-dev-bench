# Shared baseline Kconfig, both workspaces (embarch-dev-bench/design.md §2).

# embarch-dev-bench/design.md §3 decision 7: dev-bench's own log output
# travels as a `LogLine` DevBenchMessage, not raw text -- so nothing else
# (printk, the logging subsystem, the shell) may also write to the link UART
# (the board's `zephyr,console` chosen device, see main.c), or it would
# corrupt COBS framing on the shared wire. No on-board status indication for
# v1 either way (§1) -- this firmware's state is observable only through
# embarch-core/study_status, not local console output.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
