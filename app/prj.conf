# Shared baseline Kconfig, both workspaces (embarch-dev-bench/design.md §2).

# embarch-dev-bench/design.md §3 decision 7: dev-bench's own log output
# travels as a `LogLine` DevBenchMessage, not raw text -- so nothing else
# (the boot banner, a log backend, the shell) may also write to the link UART
# (the board's `zephyr,console` chosen device, see main.c), or it would corrupt
# COBS framing on the shared wire. No on-board status indication for v1 either
# way (§1) -- this firmware's state is observable only through
# embarch-core/study_status, not local console output.
#
# CONFIG_CONSOLE itself is left alone (native_sim's board Kconfig
# unconditionally force-selects console support and errors out if this tries
# to turn it off) -- disabling the things that actually call printk/log on it
# is enough, since nothing else writes to this UART unprompted.
CONFIG_BOOT_BANNER=n

# --- logging subsystem (design.md §3 decision 38) ------------------------
#
# CONFIG_LOG was `n` here from decision 7 until decision 38, and that had a
# real cost: every LOG_* call in this app and in every Zephyr subsystem it uses
# (BT host, drivers) compiled to nothing, and so did the fatal-error dump, so a
# bench that rebooted or faulted mid-study was *completely silent* from Core's
# side (see main.c's handle_hello for the study that made that concrete). What
# decision 7 actually forbids is raw log text on the shared wire -- not the
# logging subsystem itself. dev_bench_log.c is a log backend that formats each
# record and hands it to a `LogLine`, i.e. exactly the channel decision 7
# specified, so the subsystem can be on without a byte of unframed text ever
# reaching the UART.
CONFIG_LOG=y
CONFIG_LOG_OUTPUT=y

# Deferred, never immediate, and this is load-bearing rather than a default
# worth restating: in immediate mode a backend runs in the caller's context,
# including ISRs and the BT RX thread, and dev_bench_log.c's sink takes
# main.c's `link_tx_mutex` and blocks on uart_poll_out -- illegal from an ISR
# and a latency spike everywhere else. Deferred mode moves every backend call
# onto the log processing thread, which is what makes one link writer more
# (alongside the dispatch loop and the transcript TX thread) safe.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
# log_output formatting plus dbm_encode_frame's call depth on top of it. The
# 1 KB default is Zephyr's sizing for a UART backend that does neither.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# The two backends Zephyr would otherwise enable *by default* on these boards,
# both of which would break something here:
#   - LOG_BACKEND_UART defaults to y whenever there is a UART console, and
#     that console IS this link -- it would write raw text straight onto the
#     COBS wire, the precise failure decision 7 exists to prevent. This line
#     is the single most important one in this block.
#   - LOG_BACKEND_RTT defaults to y on a SEGGER-probed board (the nRF54L15DK).
#     Harmless to the wire, but it costs RAM on boards whose SRAM has already
#     overflowed twice at link time (§3 decision 27, and main.c's tx_scratch
#     consolidation), for a second channel nothing in this suite reads.
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n

# A *protection*, not a convenience: with this on, any stray printk (Zephyr
# internals, a future line in this app) is routed through the logging
# subsystem and comes out as a framed `LogLine` instead of raw bytes on the
# protocol wire. Without it, one printk anywhere corrupts a frame -- which is
# why the ESP32-C5 overlay's own comment had to record "no stray printk on
# this path -- checked, not assumed" as a prerequisite for reading a decode
# failure. This makes that check unnecessary rather than merely passed.
CONFIG_LOG_PRINTK=y

# Warn-and-above for anything that doesn't set its own level, so the BT host's
# and the drivers' info-level chatter is not on this link by default -- a
# 128-byte LogLine frame is ~1.3 ms of a 1 Mbaud wire that the study protocol
# is also using. main.c registers the app's own module at INF explicitly, so
# this firmware's own account of a run is unaffected by this ceiling. Raising
# it (or adding e.g. CONFIG_BT_LOG_LEVEL_INF) is the knob for a BLE debugging
# session; it is not a good permanent default.
CONFIG_LOG_DEFAULT_LEVEL=2

# embarch-dev-bench/design.md §3 decision 21: `struct dev_bench_message`'s
# union now includes `struct dbm_study_start`, which embeds a full
# DBM_MAX_STEPS_PER_STUDY-sized `struct dbm_step` array (StudyStart's own
# wire worst case, see serial_protocol.h) -- several KB per message value.
# main.c keeps its own message buffers `static` rather than stack locals for
# exactly this reason, but Zephyr's small default main-thread stack (1024
# bytes) isn't enough headroom for the rest of main()'s own call depth
# (ble_bridge_execute, uart_poll_*, etc.) alongside that; bumped well past
# what's actually needed as margin, since both boards have ample RAM for one
# always-alive thread stack.
CONFIG_MAIN_STACK_SIZE=8192

# embarch-dev-bench/design.md §3 decision 29: the link's inbound path must be
# interrupt-driven, not polled. main.c's dispatch loop used to call
# uart_poll_in directly and sleep 1ms whenever the FIFO was momentarily
# empty; at this link's 1 Mbaud that is ~100 bytes of arrivals per sleep,
# against a 128-byte hardware FIFO, so every frame larger than the FIFO lost
# bytes and failed to decode -- presenting as "no message received from
# dev-bench", never as an error. An ISR now drains the FIFO into a ring
# buffer (see main.c's `link_rx_ring`) so frame parsing can never be what the
# FIFO is waiting on.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# embarch-study-designer/design.md §3 decision 47, embarch-core/design.md §3
# decision 35: `HelloAck` reports this board's own factory-unique chip ID, so
# Core can confirm the board answering on the serial link is the same silicon
# its JTAG probe just verified -- the two are physically separate USB devices
# since the port migration, and nothing observable over USB tied them
# together before this.
#
# main.c's read_hardware_id() is guarded on CONFIG_HWINFO and reports an empty
# string without it, so a board target whose SoC has no hwinfo driver still
# builds and still handshakes -- it just cannot answer the question. native_sim
# is exactly that case.
CONFIG_HWINFO=y
