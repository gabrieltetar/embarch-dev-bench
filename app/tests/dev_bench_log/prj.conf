CONFIG_ZTEST=y

# The subject under test. Mirrors app/prj.conf's own logging block (design.md
# §3 decision 38) except for the two lines below it.
CONFIG_LOG=y
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n

# No processing thread here, unlike the firmware: the test drives log_process()
# itself so that "emit a record, then assert what the sink saw" is
# deterministic rather than a sleep long enough to hope the log thread ran.
CONFIG_LOG_PROCESS_THREAD=n

# ztest itself writes its own progress with printk. The firmware wants those
# routed into the log subsystem (app/prj.conf explains why that protects the
# wire); this test wants them nowhere near the sink it is asserting on.
CONFIG_LOG_PRINTK=n
