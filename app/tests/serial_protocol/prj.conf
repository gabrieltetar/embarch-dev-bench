CONFIG_ZTEST=y

# embarch-dev-bench/design.md §3 decision 21: several of this suite's own
# `struct dev_bench_message` locals (StudyStart round-trip tests) are now a
# few KB each -- `struct dbm_study_start` embeds a full
# DBM_MAX_STEPS_PER_STUDY-sized `struct dbm_step` array, see
# serial_protocol.h. Well past ztest's small 1024-byte default test-thread
# stack, so bumped generously (this is a native_sim host build, RAM is cheap).
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=16384
